# config/auth.yaml
# Prefer AUTH_BASE_URL from .env; fallback to agent.yaml base_url if unset
base_url: "http://127.0.0.1:8000/api/"  # ✅ Set to include /api/ prefix

roles:
  Admin_HC:
    login_endpoint: /auth/login/  # ✅ Relative path (base_url already includes /api/)
    user_field: "username"  # ✅ Explicitly set to match LoginRequest schema
    credentials:
      username: "admin"  # ✅ Updated: username changed from "admin" to "newusername"
      password: "admin123"
    
  Employee:
    login_endpoint: /auth/login/  # ✅ Relative path (base_url already includes /api/)
    user_field: "username"  # ✅ Explicitly set to match LoginRequest schema
    credentials:
      username: "employee1"  # ✅ Updated per OpenAPI test users (Employee1)
      password: "employee123"
  
  # ✅ Tambah test users
  Employee_2:  # untuk test IDOR
    login_endpoint: /auth/login/  # ✅ Relative path (base_url already includes /api/)
    user_field: "username"  # ✅ Explicitly set to match LoginRequest schema
    credentials:
      username: "employee2"  # ✅ Updated per OpenAPI test users (Employee2)
      password: "employee123"

# ✅ Token settings
token:
  type: "Bearer"  # atau "JWT"
  header: "Authorization"
  token_json_path: "access"  # ✅ Field name in login response (access, refresh, token)
  refresh_endpoint: /auth/refresh
  cache_enabled: true
  cache_ttl: 3600  # 1 jam
